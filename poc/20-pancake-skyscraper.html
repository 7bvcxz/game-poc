<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pancake Skyscraper</title><style>body{margin:0;background:#fff4df;color:#352514;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}h1{font-size:clamp(26px,6vw,40px)}.stats,.actions{display:flex;flex-wrap:wrap;gap:10px}button{min-height:48px;border:2px solid #6d431e;border-radius:12px;background:#ffe1a1;color:#34220e;font-weight:700;padding:12px;cursor:pointer}button:disabled{opacity:.45}#pan{height:170px;background:#444;border:10px solid #777;border-radius:50%;max-width:280px;display:grid;place-items:center;margin:18px auto;touch-action:manipulation}#cake{height:110px;width:110px;background:#f6d58e;border-radius:50%;display:grid;place-items:center;color:#573412;font-size:22px}#tower{display:flex;flex-direction:column-reverse;align-items:center;min-height:80px}.floor{background:#e9b864;border:3px solid #9b622b;width:190px;height:27px;text-align:center;border-radius:45%}#msg{min-height:50px;font-weight:700}section{background:white;border-radius:18px;padding:16px;margin:14px 0}#guide[hidden]{display:none}</style><main><h1>🥞 Pancake Skyscraper</h1><p>팬케이크를 알맞게 굽고 뒤집어 5층 빌딩을 지어 보세요. 너무 일찍 뒤집으면 반죽을 잃고, 너무 늦으면 타버립니다!</p><section><div class="stats"><strong id="money"></strong><strong id="floors"></strong><strong id="batter"></strong><strong id="heat"></strong><strong id="stability"></strong></div><p id="msg" role="status"></p><div id="pan"><div id="cake">🥞</div></div><div class="actions"><button id="cook">굽기 +1</button><button id="flip">뒤집기 · 적정 2~3</button><button id="buy">반죽 2개 구매 · 3원</button><button id="brace">지지대 강화 · 4원</button><button id="guideBtn">게임 방법</button><button id="reset">처음부터</button></div></section><section><h2>팬케이크 빌딩</h2><div id="tower"></div><p>성공: 5층 완성. 실패: 반죽과 돈이 모두 떨어지거나 안정도 0. 좋은 플립은 임대료 2원을 얻습니다. 지지대는 안정도를 2 회복합니다.</p></section><section id="guide" hidden><h2>게임 방법</h2><ol><li>굽기를 두 번 눌러 온도 2를 만드세요.</li><li>뒤집기로 층을 쌓고 임대료를 받으세요.</li><li>돈으로 반죽이나 지지대를 사서 5층을 완성하세요.</li></ol><button id="closeGuide">닫기</button></section></main><script>
const $=id=>document.getElementById(id);let s;function reset(){s={money:2,floors:0,batter:4,heat:0,stability:3,ended:false};$('tower').innerHTML='';say('첫 행동: 굽기를 두 번 누르세요.');render()}function say(t){$('msg').textContent=t}function finish(t){s.ended=true;say(t)}function render(){for(let k of ['money','floors','batter','heat','stability'])$(k).textContent=({money:'💰 돈 ',floors:'🏢 층 ',batter:'🥣 반죽 ',heat:'🔥 굽기 ',stability:'🛠 안정도 '})[k]+s[k];$('cook').disabled=s.ended||s.batter===0;$('flip').disabled=s.ended||s.batter===0;$('buy').disabled=s.ended||s.money<3;$('brace').disabled=s.ended||s.money<4||s.stability>=5;$('cake').textContent=s.heat===0?'🥞':s.heat<=3?'🔥 '+s.heat:'💨 탄다!'}function check(){if(s.floors>=5)finish('🎉 5층 완성! 승리했습니다. 처음부터 다시 도전할 수 있어요.');else if(s.stability<=0)finish('💥 건물이 무너졌습니다! 지지대를 보강하고 재도전하세요.');else if(s.batter===0&&s.money<3)finish('🥣 반죽과 돈이 부족합니다. 실패! 처음부터 다시 도전하세요.')}function cook(){if(s.ended||s.batter<=0)return;s.heat++;say(s.heat>3?'타기 시작했어요! 지금 뒤집으면 손해입니다.':'팬이 뜨거워집니다. 굽기 '+s.heat);render()}function flip(){if(s.ended||s.batter<=0)return;let h=s.heat;s.heat=0;s.batter--;if(h===2||h===3){s.floors++;s.money+=2;let f=document.createElement('div');f.className='floor';f.textContent='🥞 '+s.floors+'층';$('tower').append(f);say('완벽한 플립! +1층, 임대료 +2원.')}else{s.stability--;say(h<2?'덜 익어 무너졌어요! 안정도 -1':'타서 부서졌어요! 안정도 -1')}check();render()}function buy(){if(s.ended||s.money<3)return;s.money-=3;s.batter+=2;say('반죽 2개를 샀습니다.');render()}function brace(){if(s.ended||s.money<4||s.stability>=5)return;s.money-=4;s.stability=Math.min(5,s.stability+2);say('지지대 강화! 안정도 +2');render()}$('cook').onclick=cook;$('flip').onclick=flip;$('buy').onclick=buy;$('brace').onclick=brace;$('reset').onclick=reset;$('guideBtn').onclick=()=>{$('guide').hidden=false};$('closeGuide').onclick=()=>{$('guide').hidden=true};document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(e.code==='KeyC'){e.preventDefault();cook()}if(e.code==='KeyF'){e.preventDefault();flip()}});reset();
</script></html>
