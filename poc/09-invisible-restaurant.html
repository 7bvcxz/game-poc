<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invisible Restaurant · Game POC</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f6f1e7;background:#101b23}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28414b,#101b23 70%);min-height:100vh}main{max-width:920px;margin:auto;padding:25px 18px 50px}h1{font-size:clamp(30px,6vw,48px);margin:8px 0}p{line-height:1.55;color:#c5d5d6}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{color:#9fe0c8;font-size:12px;letter-spacing:2px;font-weight:800}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#1c303a;border:1px solid #3a5760;border-radius:12px;padding:12px 18px;flex:1;min-width:110px}.stat strong{display:block;font-size:25px;color:#ffda9e}.scene{background:linear-gradient(#223945,#192d35);border:1px solid #54727a;border-radius:24px;padding:22px;min-height:320px;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 90px,#ffffff06 91px 92px);pointer-events:none}.table{position:relative;max-width:520px;min-height:225px;margin:20px auto;background:radial-gradient(ellipse,#c49d71,#795b46);border:12px solid #4b332b;border-radius:50%;box-shadow:0 18px 0 #352b2b,0 26px 35px #0007;display:grid;place-items:center}.plate{width:155px;height:155px;border-radius:50%;border:12px double #eee0c7;background:#f4e8d4;display:grid;place-items:center;color:#634e3f;text-align:center;font-weight:700;padding:15px}.hint{position:absolute;background:#f6e5bd;color:#382c27;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;box-shadow:0 5px 12px #0005;max-width:185px}.h1{top:2px;left:0}.h2{right:0;top:12px}.h3{bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}button{cursor:pointer;font:inherit;border:1px solid #52737a;border-radius:14px;padding:15px;color:#f5f5f0;background:#24424b;transition:.15s}button:hover:not(:disabled),button:focus-visible{border-color:#ffda9e;background:#355966}button:disabled{opacity:.5;cursor:not-allowed}.choice{font-size:19px;font-weight:750;min-height:76px}.choice small{display:block;color:#b9d1d3;font-size:12px;font-weight:400;margin-top:4px}.controls{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#e9bc75;color:#29231e;font-weight:800;border-color:#e9bc75}.primary:hover:not(:disabled){background:#ffda9e;color:#29231e}.feedback{min-height:70px;padding:15px;background:#1a3138;border-radius:12px;border-left:4px solid #9fe0c8;font-size:16px;line-height:1.5}.foot{font-size:13px;color:#9bb2b8}kbd{border:1px solid #60737b;border-radius:5px;padding:1px 5px}@media(max-width:540px){.scene{padding:12px}.table{margin:30px auto;min-height:230px}.hint{font-size:12px;padding:6px 8px;max-width:125px}.h3{bottom:-6px}.choices{gap:8px}.choice{font-size:16px;padding:12px 5px}.plate{width:125px;height:125px}}
</style></head><body><main><div class="top"><div><div class="tag">GAME POC · GAME-20261029-12-01</div><h1>👻 Invisible Restaurant</h1></div><button id="reset">처음부터</button></div><p>손님은 보이지 않지만 식탁의 흔적은 남습니다. 세 가지 단서를 보고 주문을 맞히세요. 정답이면 팁을 받고, 오답이면 평판을 잃습니다!</p><div class="stats"><div class="stat">💰 수익<strong id="money">0</strong></div><div class="stat">⭐ 평판<strong id="rep">3 / 3</strong></div><div class="stat">🍽️ 손님<strong id="round">1 / 8</strong></div><div class="stat">🔥 연속 정답<strong id="streak">0</strong></div></div>
<section class="scene" aria-label="보이지 않는 손님의 식탁"><div class="table"><div class="plate" id="plate">누가 앉아<br>있을까요?</div><div class="hint h1" id="clue1"></div><div class="hint h2" id="clue2"></div><div class="hint h3" id="clue3"></div></div></section><h2>어떤 음식을 주문했을까요?</h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="controls"><button class="primary" id="next" disabled>다음 손님 →</button><button id="help">게임 방법</button></div><p class="foot">선택: 클릭·터치 또는 <kbd>1</kbd>~<kbd>4</kbd> · 목표: 8명 손님을 접대하고 100코인 이상 벌기 · 서버 없이 동작하는 단일 파일 POC</p></main>
<script>
'use strict';
const dishes=[
{name:'뜨거운 라면 🍜',clues:['김이 모락모락','젓가락 자국','빨간 국물 한 방울'],extra:['후루룩 소리','매운 향','면발 자국']},
{name:'바삭한 피자 🍕',clues:['치즈가 길게 늘어남','삼각형 기름 자국','토마토 소스 점'],extra:['바삭한 가장자리','접힌 냅킨','치즈 향']},
{name:'차가운 아이스크림 🍨',clues:['물방울이 맺힌 컵','작은 스푼 자국','달콤한 우유 향'],extra:['녹은 크림','차가운 서리','체리 꼭지']},
{name:'초밥 모둠 🍣',clues:['간장 접시 흔적','나무 젓가락 두 개','작은 밥알'],extra:['와사비 자국','생강 조각','김 향']}
];
const $=id=>document.getElementById(id);let round,money,rep,streak,answered,order,current,ended;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){round=0;money=0;rep=3;streak=0;answered=false;ended=false;order=shuffle(Array.from({length:8},(_,i)=>i%4));$('next').textContent='다음 손님 →';show()}
function stats(){$('money').textContent=money+' 코인';$('rep').textContent=rep+' / 3';$('round').textContent=Math.min(round+1,8)+' / 8';$('streak').textContent=streak}
function show(){answered=false;current=order[round];const d=dishes[current];const clues=round<4?d.clues:[d.clues[0],d.extra[(round-4)%3],d.clues[2]];clues.forEach((c,i)=>$('clue'+(i+1)).textContent=['🔍 ','✨ ','🧩 '][i]+c);$('plate').innerHTML='보이지 않는<br>손님 '+(round+1);$('choices').innerHTML='';dishes.forEach((item,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=item.name+'<small>주문 내기 · '+(i+1)+'번</small>';b.addEventListener('click',()=>choose(i));$('choices').appendChild(b)});$('feedback').textContent='단서를 관찰하고 음식을 선택하세요. 정답은 +15코인, 연속 정답 보너스는 최대 +15코인!';$('next').disabled=true;stats()}
function choose(i){if(answered||ended)return;answered=true;const correct=i===current;if(correct){streak++;const gain=15+Math.min(streak-1,3)*5;money+=gain;$('feedback').textContent='🎉 정답! '+dishes[current].name+' 주문 성공. +'+gain+'코인! 연속 '+streak+'회.';$('plate').textContent='맛있게 먹었어요!'}else{rep--;streak=0;$('feedback').textContent='😵 오답! 손님이 원한 것은 '+dishes[current].name+'였습니다. 평판 -1.';$('plate').textContent='접시가 흔들려요…'}Array.from($('choices').children).forEach((b,n)=>{b.disabled=true;if(n===current)b.style.borderColor='#9fe0c8';else if(n===i)b.style.borderColor='#ff8e8e'});stats();if(rep===0||round===7){finish()}else{$('next').disabled=false}}
function finish(){ended=true;$('next').disabled=true;const won=rep>0&&money>=100;$('feedback').textContent+=(won?' 🏆 영업 성공!':' 💔 영업 종료!')+' 최종 수익 '+money+'코인. 처음부터 버튼으로 다시 도전하세요.';$('plate').textContent=won?'🏆 인기 맛집!':'영업 종료';$('next').textContent='영업 종료'}
$('next').addEventListener('click',()=>{if(!answered||ended)return;round++;show()});$('reset').addEventListener('click',reset);$('help').addEventListener('click',()=>{$('feedback').textContent='식탁 주변 세 단서를 읽고 4개 메뉴 중 하나를 고르세요. 정답 +15~30코인, 오답 평판 -1. 평판 0이면 즉시 종료, 8명 종료 시 평판이 남고 100코인 이상이면 승리!'});document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&!answered&&!ended)choose(Number(e.key)-1);else if(e.key==='Enter'&&answered&&!ended)$('next').click()});reset();
</script></body></html>
