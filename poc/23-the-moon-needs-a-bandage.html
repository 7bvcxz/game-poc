<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Moon Needs a Bandage</title><style>body{margin:0;background:#10152c;color:#f5f3ff;font:17px system-ui}main{max-width:760px;margin:auto;padding:20px}h1{font-size:30px}button{min-height:48px;padding:10px 17px;border:0;border-radius:12px;background:#d7b9ff;color:#211436;font-weight:700;cursor:pointer;margin:5px}button:disabled{opacity:.4}section{background:#252d4c;padding:16px;border-radius:18px;margin:12px 0}.moon{width:min(80vw,290px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9d8,#b0a9c4);margin:18px auto;position:relative;box-shadow:0 0 45px #a8a1d780}.crack{position:absolute;left:48%;top:20%;height:60%;border-left:6px dashed #554563;transform:rotate(var(--angle));}.tape{position:absolute;left:46%;top:28%;width:14px;height:46%;background:#a8f0d2;transform:rotate(var(--tape));opacity:0.85}input{width:100%;accent-color:#d7b9ff}#message{min-height:46px}small{color:#c5c8dc}</style><main><h1>🌙 The Moon Needs a Bandage</h1><p>달의 균열에 테이프를 붙여 달을 치료해! <b>3곳 수리하면 승리</b>, 접착력 0이면 실패.</p><section><b id="stats"></b><div class="moon" aria-label="달 균열과 테이프 미리보기"><div class="crack" id="crack"></div><div class="tape" id="tape"></div></div><label for="angle">테이프 각도 조절 (← → 키도 가능): <b id="angleText"></b></label><input id="angle" type="range" min="-90" max="90" step="15" value="0"><p id="message" role="status"></p><button id="patch">테이프 붙이기 (접착력 1)</button><button id="buy">섬유로 접착력 +2 (섬유 1)</button><button id="reset">처음부터</button><button id="help">게임 방법</button><p id="guide" hidden>① 슬라이더나 방향키로 테이프 각도를 균열에 맞춰. ② 붙이기를 누르면 정확도에 따라 수리하거나 접착력을 잃어. ③ 성공하면 섬유 1개를 얻어 접착력을 보충할 수 있어. 총 3번 성공하면 승리!</p></section><small>설계 목표: 10초 첫 행동, 30초 첫 수리, 1분 선택 변화. 실제 사용자 시간 검증 아님.</small></main><script>const $=id=>document.getElementById(id);let s;const targets=[-45,30,75];function reset(){s={fixed:0,glue:4,fiber:0,angle:0,ended:false};$('angle').value=0;$('guide').hidden=true;render('첫 균열에 맞춰 각도를 조절하고 테이프를 붙여!')}function render(msg){$('stats').textContent=`수리 ${s.fixed}/3 · 접착력 ${s.glue} · 섬유 ${s.fiber}`;$('angleText').textContent=s.angle+'°';$('crack').style.setProperty('--angle',targets[Math.min(s.fixed,2)]+'deg');$('tape').style.setProperty('--tape',s.angle+'deg');$('patch').disabled=s.ended||s.glue<1;$('buy').disabled=s.ended||s.fiber<1;$('angle').disabled=s.ended;$('message').textContent=msg}function patch(){if(s.ended||s.glue<1)return;s.glue--;const error=Math.abs(s.angle-targets[s.fixed]);if(error<=15){s.fixed++;s.fiber++;if(s.fixed===3){s.ended=true;render('🎉 달 치료 성공! 3곳을 모두 봉합했어. 처음부터로 다시 도전!');return}render('✨ 봉합 성공! 섬유 +1. 다음 균열 각도를 맞춰!')}else if(s.glue===0){s.ended=true;render('💔 접착력이 떨어져 실패! 처음부터 다시 도전해.')}else render('각도가 맞지 않아! 접착력 -1. 균열 방향을 다시 확인해.')}function buy(){if(s.ended||s.fiber<1)return;s.fiber--;s.glue+=2;render('접착력 +2 충전! 다음 수리를 준비해.')}function setAngle(v){if(s.ended)return;s.angle=Math.max(-90,Math.min(90,Math.round(v/15)*15));$('angle').value=s.angle;render('각도 '+s.angle+'°로 조절했어. 균열에 맞춰 붙여!')}$('angle').addEventListener('input',e=>setAngle(+e.target.value));$('patch').onclick=patch;$('buy').onclick=buy;$('reset').onclick=reset;$('help').onclick=()=>{$('guide').hidden=!$('guide').hidden};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(e.target.tagName==='BUTTON')return;e.preventDefault();setAngle(s.angle+(e.key==='ArrowRight'?15:-15))}});reset();</script></html>
